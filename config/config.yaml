# miranda-diary configuration.
# Every field except known_users is optional — missing fields use built-in
# defaults. Secrets come from environment variables, never from here.

# http_addr: ":8789"
# auth_token_env: "DIARY_MCP_TOKEN"

# database:
#   path: "data/diary.db"

# embedding:
#   api_key_env: "GEMINI_API_KEY"
#   model: "gemini-embedding-2"

# search:
#   default_limit: 10
#   max_limit: 50

# known_users has no built-in default and MUST be set: the closed list of
# user_id values every tool call is checked against (Miranda's own userID
# for each household member — see config.Config.KnownUsers). Left unset,
# the service refuses to start rather than run with no allowlist at all.
# This repo's own template intentionally does not hardcode real household
# member names — set the real list only in the server's own config.yaml
# (not touched by deploy, see CLAUDE.md), e.g.:
# known_users:
#   - "archer"
#   - "anna"

logging:
  level: "info"
